services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-keystone}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - keystone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/keystone
      DATABASE_USERNAME: keystone
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-keystone}
      KEYSTONE_DEMO_USERNAME: ${KEYSTONE_DEMO_USERNAME:-manager@maplegrove.in}
      KEYSTONE_DEMO_PASSWORD: ${KEYSTONE_DEMO_PASSWORD:-maple-grove-2026}
      KEYSTONE_JWT_SECRET: ${KEYSTONE_JWT_SECRET:-local-development-secret-change-this-before-deployment-2026}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    environment:
      PORT: "80"
      API_UPSTREAM: backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  keystone-postgres-data:
