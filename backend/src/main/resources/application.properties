spring.application.name=keystone-society-ops
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:5433}/${DATABASE_NAME:keystone}}
spring.datasource.username=${DATABASE_USERNAME:keystone}
spring.datasource.password=${DATABASE_PASSWORD:keystone}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

keystone.auth.username=${KEYSTONE_DEMO_USERNAME:manager@maplegrove.in}
keystone.auth.password=${KEYSTONE_DEMO_PASSWORD:maple-grove-2026}
keystone.auth.jwt-secret=${KEYSTONE_JWT_SECRET:local-development-secret-change-this-before-deployment-2026}
keystone.auth.jwt-ttl-hours=12
